<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MusicXML Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; color: #222; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    #score { background: #fff; border: 1px solid #ddd; overflow-x: auto; color: #111; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <strong>MusicXML Viewer</strong>
    <input id="file" type="file" accept=".musicxml,.xml" />
    <button id="sample">サンプルを表示</button>
    <span id="error"></span>
  </header>
  <div id="score"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
